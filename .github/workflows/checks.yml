# Runs on every push and pull request. The pre-commit hook only protects clones that turned it on;
# this is the same check on GitHub's side, so a fork or a contributor without the hook is still covered.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  personal-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # gitleaks reads the whole history, not just the last commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # The fixed patterns and the allowlist. The private blocklist lives in .git on your
      # machine only, so it cannot run here.
      - name: Guard (every tracked file)
        run: python3 scripts/check_repo_clean.py --all
      - name: Guard tests
        run: python3 scripts/test_check_repo_clean.py
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: macos-latest  # the scripts target macOS; Finder tags and pmset tests skip elsewhere
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]  # the scripts promise 3.9, the oldest Python on a stock Mac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Chapter 1 round trip
        run: python3 chapters/01-files-and-folders/test_roundtrip.py
      - name: Chapter 1D projects
        run: python3 chapters/01-files-and-folders/1d-projects/test_projects.py
      - name: Chapter 1D sweep
        run: python3 chapters/01-files-and-folders/1d-projects/test_sweep.py
